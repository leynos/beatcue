name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install CLI tools
        env:
          # Pin every tool the job installs. An unpinned linter turned main red
          # on 2026-07-30 and kept it red. ruff and ty are not installed here:
          # both are development dependencies, so uv.lock pins them and
          # dependabot moves them deliberately.
          MBAKE_VERSION: '1.4.6'
          MARKDOWNLINT_CLI2_VERSION: '0.23.2'
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Run tests with coverage
        env:
          SLIPCOVER_VERSION: '1.1.0'
          PYTEST_FORKED_VERSION: '1.7.5'
        run: |
          uv pip install \
            "slipcover==${SLIPCOVER_VERSION}" \
            "pytest-forked==${PYTEST_FORKED_VERSION}"
          uv run python -m slipcover \
            --source=./beatcue \
            --omit="*/unittests/*,*/.venv/*" \
            --branch \
            --out coverage.xml \
            -m pytest --forked -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Install CodeScene Coverage CLI
        if: env.CS_ACCESS_TOKEN != ''
        env:
          CODESCENE_INSTALLER_URL: https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh
        run: |
          set -euo pipefail
          # Download, verify, then execute. Piping curl into bash executes the
          # script before anything can check it, which made the digest
          # comparison that used to follow decorative; it also compared against
          # a file the pipe never wrote, so it could not have passed. The digest
          # is required rather than optional for the same reason: an absent
          # variable must not silently mean "run whatever the server sends".
          if [ -z "${CODESCENE_CLI_SHA256:-}" ]; then
            echo "::error::CODESCENE_CLI_SHA256 must name the installer digest" >&2
            exit 1
          fi
          curl -fsSL "${CODESCENE_INSTALLER_URL}" -o install-cs-coverage-tool.sh
          echo "${CODESCENE_CLI_SHA256}  install-cs-coverage-tool.sh" | sha256sum -c -
          bash install-cs-coverage-tool.sh -y

      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN != ''
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found!"
            exit 1
          fi
          cs-coverage upload \
            --format "cobertura" \
            --metric "line-coverage" \
            coverage.xml
